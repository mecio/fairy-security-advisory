name: Feature request
description: Suggest a reusable improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please describe the reusable outcome without including private environment data.
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem should the feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and expected result.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety considerations
      description: Consider read-only scanning, secrets, local data, network access, and destructive actions.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
